baseURL: https://gstechschulte.github.io
languageCode: en-us
title: Gabes Gulch
theme: hugo-omegion
enableEmoji: true
enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - searchindex

outputFormats:
  searchindex:
    mediaType: application/json
    baseName: index
    isPlainText: true
    notAlternative: true

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4

taxonomies:
  tag: tags

params:
  math: true
  enableEmoji: true
  enableSearch: true
  enableTableOfContents: true
  description: Hey, I am Gabriel. My interests and work includes probabilistic programming and optimization.
  author:
    name: Gabriel Stechschulte
    bio:
      - Hey, I am Gabriel. My interests and work includes probabilistic programming and optimization.
    links:
      - name: GitHub
        url: https://github.com/GStechschulte
        icon: github
      - name: X
        url: https://x.com/__gsteck__
        icon: x
      - name: LinkedIn
        url: https://www.linkedin.com/in/gabrielstechschulte/
        icon: linkedin
